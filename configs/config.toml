[global]
strategy = "configs/strategy.toml"
logbase = "sqlite:///logbase.db"

[local]
format = "llama-2"
gpu = true
ram = false

[local.model]
name = "Distill-Llama-8B"
directory = "models/"
suffix = ".gguf"


[remote]
model = "llama3:latest"

[remote.server]
url = "http://localhost"
port = 11434
endpoint = "api/"